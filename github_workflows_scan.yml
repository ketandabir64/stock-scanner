name: 📊 Combined Scanners

on:
  schedule:
    # 8:15 AM IST = 2:45 AM UTC (Breakout Scanner)
    - cron: '45 2 * * 1-5'
    # 9:35 AM IST = 4:05 AM UTC (Pre-Market Decoder)
    - cron: '5 4 * * 1-5'

  workflow_dispatch:

jobs:
  breakout-scanner:
    if: github.event.schedule == '45 2 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install yfinance pandas numpy openpyxl requests
    - run: python combined_stock_scanner_with_email.py
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: breakout-results
        path: Combined_Scanner_*.xlsx

  premarket-decoder:
    if: github.event.schedule == '5 4 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install yfinance pandas numpy openpyxl requests
    - run: python pre_market_decoder.py
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: premarket-results
        path: PreMarket_Decoder_*.xlsx
