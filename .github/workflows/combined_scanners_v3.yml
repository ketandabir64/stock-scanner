name: 📊 Combined Scanners (v3 - Global Mood + Daily Mail Fix)

on:
  schedule:
    # 8:15 AM IST = 2:45 AM UTC (Breakout Scanner) — Mon-Fri
    - cron: '45 2 * * 1-5'
    # 9:35 AM IST = 4:05 AM UTC (Pre-Market Decoder) — Mon-Fri
    - cron: '5 4 * * 1-5'

  workflow_dispatch:

jobs:
  breakout-scanner:
    # Only run for the 2:45 AM UTC cron OR manual trigger
    if: (github.event.schedule == '45 2 * * 1-5' && github.event_name == 'schedule') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install yfinance pandas numpy openpyxl requests

    - name: Run Breakout Scanner
      run: python combined_stock_scanner_with_email_v3.py
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}

    - name: Upload Breakout Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: breakout-results-${{ github.run_id }}
        path: Combined_Scanner_*.xlsx
        if-no-files-found: warn

  premarket-decoder:
    # Only run for the 4:05 AM UTC cron OR manual trigger
    if: (github.event.schedule == '5 4 * * 1-5' && github.event_name == 'schedule') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install yfinance pandas numpy openpyxl requests

    - name: Run Pre-Market Decoder
      run: python pre_market_decoder_v2.py
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}

    - name: Upload PreMarket Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: premarket-results-${{ github.run_id }}
        path: PreMarket_Decoder_*.xlsx
        if-no-files-found: warn
