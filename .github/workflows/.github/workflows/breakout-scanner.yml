name: 📊 Breakout Scanner

on:
  schedule:
    - cron: '45 2 * * 1-5'   # Mon-Fri 8:15 AM IST
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy openpyxl requests
      - run: python combined_stock_scanner_with_email.py
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: breakout-results
          path: Combined_Scanner_*.xlsx
