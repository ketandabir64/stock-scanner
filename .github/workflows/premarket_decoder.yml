name: 📊 Pre-Market Decoder (9:35 AM)

on:
  schedule:
    - cron: '5 4 * * 1-5'
  workflow_dispatch:

jobs:
  run-decoder:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install yfinance pandas numpy openpyxl requests
    - run: python pre_market_decoder.py
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: premarket-results
        path: PreMarket_Decoder_*.xlsx
